name: keep-warm
# Render's free plan sleeps after 15 idle minutes. Ping both live demos every 10 minutes
# so the first visitor doesn't wait for a cold start. Remove after 2026-11-25.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.run_started_at < '2026-11-26'
    steps:
      - name: Ping SIEGE and DARWIN
        run: |
          for url in https://near-siege.onrender.com/healthz https://near-darwin.onrender.com/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$url" || true)
            echo "$url -> $code"
          done
