name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: astral-sh/setup-uv@v5
      - name: "Rust 1.97.1 with the wasm target and rust-src (pinned, so the contract build reproduces the deployed bytes)"
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown --component rust-src
          echo "RUSTUP_TOOLCHAIN=1.97.1" >> "$GITHUB_ENV"
      - run: make install
      - name: make test (Rust contract tests, unit tests, typecheck)
        run: make test
      - name: contract build reproduces the deployed wasm (sha256 check)
        run: make contract-build && git diff --exit-code contract/res/
      - name: keyless replays reproduce the committed results
        run: |
          make eval attack threat redteam
          # decision latencies are wall-clock measurements and vary run to run. The judge "hits"/"live" counters say
          # whether a call came from the cache or the API: the committed redteam runs made some calls live, a keyless
          # replay serves all of them from the cache, so those two counters differ by design. Every other line must match.
          git diff --exit-code -I 'latency|p50ms|p99ms' -I '^ *"(hits|live)": [0-9]+,$' results/
