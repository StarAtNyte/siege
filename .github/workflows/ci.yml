name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx tsx src/eval/run.ts
      - uses: astral-sh/setup-uv@v5
      - run: cd engine && uv run siege-attack --generations 8 --pop 32 --seeds 1
